---
- name: Update and upgrade packages
  apt:
    update_cache: yes
    upgrade: safe

- name: Create non-root user
  user:
    name: "{{ vps_user }}"
    shell: /bin/bash
    groups: sudo
    append: yes
    create_home: yes
    password: "{{ vps_password | password_hash('sha512') }}"

- name: Set up SSH directory for new user
  file:
    path: "/home/{{ vps_user }}/.ssh"
    state: directory
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: '0700'

- name: Copy root's authorized keys to the new user
  copy:
    src: "/root/.ssh/authorized_keys"
    dest: "/home/{{ vps_user }}/.ssh/authorized_keys"
    remote_src: yes
    owner: "{{ vps_user }}"
    group: "{{ vps_user }}"
    mode: '0600'

- name: Install UFW firewall
  apt:
    name: ufw
    state: present

- name: Allow essential ports in UFW
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_ports }}"

- name: Enable UFW
  ufw:
    state: enabled

- name: Harden SSH configuration
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no'}
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no'}

- name: Install Fail2ban and Unattended-Upgrades
  apt:
    name:
      - fail2ban
      - unattended-upgrades
    state: present

- name: Set Timezone
  timezone:
    name: "{{ vps_timezone }}"

- name: Switch connection user to the new non-root user for post-reboot tasks
  meta: reset_connection

- name: Update connection variables for subsequent tasks
  set_fact:
    ansible_user: "{{ vps_user }}"
    ansible_become_password: "{{ vps_password }}"
  
# --- REBOOT HANDLING V_0 JUST FOR UBUNTU/DEBIAN ---

- name: Check if a reboot is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot the server if kernel/system updates require it
  reboot:
    msg: "Rebooting machiening automatically via Ansible due to system updates"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 300
  when: reboot_required_file.stat.exists
  become: true
