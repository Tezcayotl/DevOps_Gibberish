- name: Install Astral uv via official installer
  shell:
    cmd: curl -LsSf https://astral.sh/uv/install.sh | sh
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/uv"

- name: Add Helix editor PPA using DEB822 format
  deb822_repository:
    name: maveonair-helix-editor
    types: [deb]
    uris: https://ppa.launchpadcontent.net/maveonair/helix-editor/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x355A4FA515D7C855"
    state: present
    
- name: Install Helix editor
  apt:
    name: helix
    state: present
    update_cache: true
